    <script>
      (function() {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            localStorage.removeItem('theme');
          }
          var saved = localStorage.getItem('patcha_daily_theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#060A13');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#FDF2F8');
          }
          var savedFontFamily = localStorage.getItem('patcha_daily_font_family');
          if (savedFontFamily) {
            document.documentElement.style.setProperty('--app-font-family', savedFontFamily);
          }
        } catch(e) {}
      })();
    </script>
